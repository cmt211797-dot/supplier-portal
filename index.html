create table if not exists suppliers (
  id text primary key, name text, supplier_no text,
  access_token text unique not null, contact text,
  created_at timestamptz default now());
create table if not exists products (
  id bigint generated always as identity primary key, name text, sku_code text,
  supplier_no text, category text, type text, created_at timestamptz default now());
create table if not exists admin_collaborators (
  id text primary key, name text, token text unique not null,
  permissions jsonb, created_at timestamptz default now());
create table if not exists inventory (
  id text primary key, supplier_id text, product_code text, product_name text,
  stock int, created_at timestamptz default now(), updated_at timestamptz);
create table if not exists capacity_month (
  id text primary key, supplier_id text, month text, days_in_month int,
  sched_days int, avg_daily_capacity int, created_at timestamptz default now(), updated_at timestamptz);
create table if not exists daily_output (
  id text primary key, supplier_id text, product_code text, product_name text,
  date date, qty int, created_at timestamptz default now(), updated_at timestamptz);
create table if not exists stocking_plan (
  id text primary key, supplier_id text, product_code text, product_name text,
  month text, plan_qty int, completed_qty int, planned_finish_date date,
  created_at timestamptz default now(), updated_at timestamptz);

create index if not exists idx_inv_sup on inventory(supplier_id);
create index if not exists idx_cap_sup on capacity_month(supplier_id, month);
create index if not exists idx_out_sup on daily_output(supplier_id, product_code, date);
create index if not exists idx_stk_sup on stocking_plan(supplier_id, product_code, month);
